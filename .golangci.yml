version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/garyblankenship/wormhole/v3

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - gosec
    - dupl
    - gocyclo
    - misspell
    - unparam
    - nakedret
    - prealloc
    - bodyclose
    - rowserrcheck
    - copyloopvar
  settings:
    govet:
      enable: []
    gocyclo:
      min-complexity: 25
    dupl:
      threshold: 100
    goconst:
      min-len: 2
      min-occurrences: 3
    misspell:
      locale: US
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - dupl
          - unparam
          - prealloc
      - path: examples/
        linters:
          - gocyclo
      - linters:
          - staticcheck
        text: "ST1000:"
      - path: providers/internal/transform/streaming\.go
        linters:
          - gocyclo
      - path: internal/server/responses_stream\.go
        linters:
          - gocyclo
      - path: text_builder_generate\.go
        linters:
          - gocyclo
      - path: tool_executor_execute\.go
        linters:
          - gocyclo
      - path: providers/internal/stream/process\.go
        linters:
          - gocyclo
      - path: providers/openai/transform_schema\.go
        linters:
          - gocyclo
      - path: providers/(anthropic|openai)/stream_remediation_test\.go
        linters:
          - gocyclo
      - path: middleware/adapter\.go
        linters:
          - dupl
      - path: (image_builder|structured_builder)\.go
        linters:
          - dupl
      - path: middleware/typed_enhanced_metrics\.go
        linters:
          - dupl
